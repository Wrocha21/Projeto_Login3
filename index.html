<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="Css/Mediaquieres.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Tela de Login</title>
</head>
<body>
    <main id="conteiner">
        <div class="imagem"></div>
        <form autocomplete="off" id="formLg">
            <div class="logo">
                <img src="Assets/Logo.png" width="100" alt="">
            </div>
            <div class="input-box">
                <i id="icons" class="fa-solid fa-user"></i>
                <input type="text" name="user" id="user"  placeholder="Nome de Usuario" pattern="setcustomvalidity">
            </div>
            <label for="user"></label>

            <div class="input-box">
                <i id="icons" class="fa-solid fa-envelope"></i>
                <input type="email" name="email" id="1email"   placeholder="example@gmail.com">
            </div>
            <label for="1email"></label>

            <div class="input-box">
                <i id="icons" class="fa-solid fa-key"></i>
                <input type="password" name="password" id="senha"  placeholder="Sua Senha"  autocomplete="current-password">
            </div>
            <div id="res"></div>

            <input type="submit" value="Login" onclick="logar()">
            <a id="input-rec" href="#">
                 Esqueceu sua Senha?
            </a>
            <div class="social">
                <a href="#">
                    <img class="ic" id="ic1" src="Assets/IconGit.png" alt="">
                </a>
                <a href="#">
                    <img class="ic" id="ic2" src="Assets/IconGoogle.png" alt="">
                </a>
                <a href="#">
                    <img class="ic" id="ic3" src="Assets/IconFace.png" alt="">
                </a>
            </div>
        </form>
    </main>
    <script src="Javascript/script.js"></script>
</body>

</html>
